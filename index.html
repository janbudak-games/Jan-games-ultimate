
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jan Games</title>

<style>
body {
  margin: 0;
  background: #10121c;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 25px;
  text-align: center;
  background: #191d2d;
}
h1 { color: #7c8cff; }
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}
.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}
.game {
  background: #202538;
  border-radius: 12px;
  overflow: hidden;
}
.game h2 {
  padding: 12px;
  font-size: 18px;
}
.game iframe {
  width: 100%;
  height: 280px;
  border: none;
}
button {
  background: #7185ff;
  color: white;
  border: none;
  padding: 10px 15px;
  margin: 10px;
  border-radius: 7px;
  cursor: pointer;
}
footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
}
</style>
</head>

<body>

<header>
<h1>JAN GAMES</h1>
<p>Play your favorite games online</p>
</header>

<div class="container">
<div class="games" id="games"></div>
</div>

<footer>
Created by Jan Budak
</footer>

<script>
const games = [
  ["Impossible Quiz", "https://gamezipper.com/impossible-quiz/?utm_source=embed"],
  ["Little Alchemy", "https://gamezipper.com/little-alchemy/?utm_source=embed"],
  ["Checkers", "https://gamezipper.com/checkers/?utm_source=embed"],
  ["Snake", "https://gamezipper.com/snake/?utm_source=embed"],
  ["Neon Dash", "https://gamezipper.com/neon-dash/?utm_source=embed"],
  ["Bridge Builder", "https://gamezipper.com/bridge-builder/?utm_source=embed"],
  ["Kitchen Rush", "https://gamezipper.com/kitchen-rush/?utm_source=embed"],
  ["FNF Huggy Wuggy", "https://botstudio.itch.io/huggywuggy"]
];

const container = document.getElementById("games");

games.forEach(([name, url]) => {
  const card = document.createElement("div");
  card.className = "game";

  const title = document.createElement("h2");
  title.textContent = name;

  const frame = document.createElement("iframe");
  frame.src = url;
  frame.allowFullscreen = true;
  frame.allow = "autoplay; fullscreen; gamepad";

  card.appendChild(title);
  card.appendChild(frame);
  container.appendChild(card);
});
</script>

</body>
</html>
